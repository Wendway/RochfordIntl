<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <rect width="600" height="720" fill="#f7f7f9"/>
  <!-- laptop -->
  <rect x="40" y="60" width="520" height="340" rx="16" fill="#2c2a5c"/>
  <rect x="58" y="78" width="484" height="304" rx="6" fill="#fff"/>
  <text x="78" y="110" font-size="17" font-weight="700" fill="#2c2a5c">Advanced Analytics</text>
  <text x="78" y="130" font-size="12" fill="#999">Model performance &amp; forecast</text>
  <circle cx="500" cy="106" r="10" fill="#ff8a00"/>
  <!-- line chart -->
  <g stroke="#eee"><line x1="78" y1="170" x2="522" y2="170"/><line x1="78" y1="220" x2="522" y2="220"/><line x1="78" y1="270" x2="522" y2="270"/><line x1="78" y1="320" x2="522" y2="320"/></g>
  <polygon points="78,300 140,280 200,290 260,240 320,250 380,200 440,210 522,160 522,350 78,350" fill="#ff8a00" opacity=".12"/>
  <polyline points="78,300 140,280 200,290 260,240 320,250 380,200 440,210 522,160" fill="none" stroke="#ff8a00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="380,200 440,190 522,140" fill="none" stroke="#2c2a5c" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
  <circle cx="522" cy="160" r="7" fill="#fff" stroke="#ff8a00" stroke-width="4"/>
  <rect x="40" y="400" width="520" height="22" rx="8" fill="#1d1b45"/>
  <rect x="250" y="400" width="100" height="8" rx="4" fill="#3a3874"/>
  <!-- KPI cards -->
  <g>
    <rect x="40" y="460" width="160" height="110" rx="12" fill="#fff" stroke="#e5e5ea"/>
    <text x="60" y="495" font-size="13" fill="#999">Accuracy</text>
    <rect x="60" y="515" width="120" height="10" rx="5" fill="#eee"/><rect x="60" y="515" width="104" height="10" rx="5" fill="#ff8a00"/>
    <rect x="60" y="540" width="80" height="8" rx="4" fill="#e5e5ea"/>
  </g>
  <g>
    <rect x="220" y="460" width="160" height="110" rx="12" fill="#fff" stroke="#e5e5ea"/>
    <text x="240" y="495" font-size="13" fill="#999">Signals</text>
    <rect x="242" y="530" width="16" height="25" fill="#2c2a5c"/><rect x="266" y="515" width="16" height="40" fill="#2c2a5c"/><rect x="290" y="522" width="16" height="33" fill="#2c2a5c"/><rect x="314" y="505" width="16" height="50" fill="#ff8a00"/><rect x="338" y="512" width="16" height="43" fill="#2c2a5c"/>
  </g>
  <g>
    <rect x="400" y="460" width="160" height="110" rx="12" fill="#fff" stroke="#e5e5ea"/>
    <text x="420" y="495" font-size="13" fill="#999">Segments</text>
    <circle cx="480" cy="530" r="26" fill="none" stroke="#e5e5ea" stroke-width="12"/>
    <circle cx="480" cy="530" r="26" fill="none" stroke="#ff8a00" stroke-width="12" stroke-dasharray="110 200" transform="rotate(-90 480 530)"/>
    <circle cx="480" cy="530" r="26" fill="none" stroke="#2c2a5c" stroke-width="12" stroke-dasharray="35 200" stroke-dashoffset="-110" transform="rotate(-90 480 530)"/>
  </g>
  <!-- network nodes -->
  <g stroke="#c9c8de" stroke-width="2"><line x1="90" y1="640" x2="200" y2="680"/><line x1="200" y1="680" x2="320" y2="630"/><line x1="320" y1="630" x2="430" y2="675"/><line x1="430" y1="675" x2="520" y2="625"/><line x1="200" y1="680" x2="430" y2="675"/></g>
  <circle cx="90" cy="640" r="9" fill="#2c2a5c"/><circle cx="200" cy="680" r="11" fill="#ff8a00"/><circle cx="320" cy="630" r="9" fill="#2c2a5c"/><circle cx="430" cy="675" r="11" fill="#2c2a5c"/><circle cx="520" cy="625" r="9" fill="#ff8a00"/>
</svg>
